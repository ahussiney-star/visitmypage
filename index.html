<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة معلمي العلوم - Visit My Website</title>
    <!-- استيراد الخط العربي وتنسيقات التصميم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #0077b6;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        .form-section {
            background: #e9f5fd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #bde0fe;
        }
        .form-section h3 {
            margin-bottom: 15px;
            color: #03045e;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
            color: #023e8a;
        }
        select, input, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #0077b6;
            box-shadow: 0 0 5px rgba(0,119,182,0.3);
        }
        .btn-submit {
            background-color: #0077b6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #023e8a;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #0077b6;
            color: white;
        }
        tr:hover {
            background-color: #f1f8fc;
        }
        .visit-btn {
            background-color: #2a9d8f;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
        }
        .visit-btn:hover {
            background-color: #21867a;
        }
        /* زر اللايك */
        .like-btn {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            color: #495057;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .like-btn:hover {
            background-color: #e2e6ea;
            border-color: #dae0e5;
        }
        .like-btn.liked {
            background-color: #e63946;
            color: white;
            border-color: #d90429;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔬 بوابة مشاريع معلمي العلوم</h1>
    <p class="subtitle">استكشف مواقع الويب التعليمية المبتكرة وادعم زملائك بالإعجاب</p>

    <!-- نموذج إضافة موقع -->
    <div class="form-section">
        <h3>إضافة موقع جديد</h3>
        <form id="websiteForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="teacherName">اسم المعلم</label>
                    <select id="teacherName" required>
                        <option value="">-- اختر اسم المعلم --</option>
                        <option value="أ. أحمد الحسيني">أ. أحمد الحسيني</option>
                        <option value="أ. رضا مسعد">أ. رضا مسعد</option>
                        <option value="أ. علي الشرقاوي">أ. علي الشرقاوي</option>
                        <option value="أ. محمد عمران">أ. محمد عمران</option>
                        <option value="أ. عمر السيد">أ. عمر السيد</option>
                        <option value="أ. جاسم السلطان">أ. جاسم السلطان</option>
                        <option value="أ. محمد عبد العزيز">أ. محمد عبد العزيز</option>
                        <option value="أ. إسلام خليل">أ. إسلام خليل</option>
                        <option value="أ. أحمد مجدي">أ. أحمد مجدي</option>
                        <option value="أ. حسن حسام">أ. حسن حسام</option>
                        <option value="أ. محمد عبد السميع">أ. محمد عبد السميع</option>
                        <option value="أ. حسام معوض">أ. حسام معوض</option>
                        <option value="أ. علاء السيد">أ. علاء السيد</option>
                        <option value="أ. سامي محمد">أ. سامي محمد</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="websiteUrl">رابط الموقع (URL)</label>
                    <input type="url" id="websiteUrl" placeholder="https://example.com" required>
                </div>
                <div class="form-group full-width">
                    <label for="websiteDesc">وصف الموقع</label>
                    <input type="text" id="websiteDesc" placeholder="مثال: موقع تفاعلي لشرح تجارب الكيمياء العضوية باستخدام PhET" required>
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn-submit">نشر وإضافة الموقع</button>
                </div>
            </div>
        </form>
    </div>

    <!-- جدول عرض المواقع -->
    <div>
        <h3>المواقع المضافة</h3>
        <table>
            <thead>
                <tr>
                    <th>اسم المعلم</th>
                    <th>وصف الموقع</th>
                    <th>رابط الموقع</th>
                    <th>التقييم (الإعجابات)</th>
                </tr>
            </thead>
            <tbody id="websitesTableBody">
                <!-- يتم تعبئة البيانات ديناميكياً عبر الجافاسكريبت -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // استرجاع البيانات من التخزين المحلي أو البدء بجدول فارغ
    let websites = JSON.parse(localStorage.getItem('scienceWebsites')) || [];

    const form = document.getElementById('websiteForm');
    const tableBody = document.getElementById('websitesTableBody');

    function renderTable() {
        tableBody.innerHTML = '';
        if (websites.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="4" style="color:#778899; padding:20px;">لا توجد مواقع مضافة حالياً. كن أول المشاركين!</td></tr>`;
            return;
        }

        websites.forEach((site, index) => {
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td><strong>${site.name}</strong></td>
                <td>${site.desc}</td>
                <td><a href="${site.url}" target="_blank" class="visit-btn">زيارة الموقع</a></td>
                <td>
                    <button class="like-btn ${site.isLiked ? 'liked' : ''}" onclick="toggleLike(${index})">
                        ❤️ إعجاب <span class="like-count">(${site.likes || 0})</span>
                    </button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // إضافة موقع جديد
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('teacherName').value;
        const url = document.getElementById('websiteUrl').value;
        const desc = document.getElementById('websiteDesc').value;

        websites.push({
            id: Date.now(),
            name,
            url,
            desc,
            likes: 0,
            isLiked: false
        });

        localStorage.setItem('scienceWebsites', JSON.stringify(websites));
        form.reset();
        renderTable();
    });

    // دالة التعامل مع زر اللايك
    function toggleLike(index) {
        if (!websites[index].isLiked) {
            websites[index].likes = (websites[index].likes || 0) + 1;
            websites[index].isLiked = true;
        } else {
            websites[index].likes = Math.max(0, (websites[index].likes || 1) - 1);
            websites[index].isLiked = false;
        }

        localStorage.setItem('scienceWebsites', JSON.stringify(websites));
        renderTable();
    }

    // التشغيل الأول
    renderTable();
</script>

</body>
</html>
